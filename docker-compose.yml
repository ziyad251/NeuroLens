services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: alzheimers-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP (test)
      - "8025:8025"   # Web UI — open http://localhost:8025

  mongo:
    image: mongo:7
    container_name: alzheimers-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: alzheimers-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      FLASK_PORT: 5000
      FLASK_DEBUG: "0"
      MODEL_PATH: /app/models/model.pth

      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: alzheimers

      # Streamlit origin for CORS
      CORS_ORIGINS: http://localhost:8501
    ports:
      - "5000:5000"
    volumes:
      # optional: keep model file updatable without rebuilding image
      - ./models:/app/models

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: alzheimers-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:5000
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend

volumes:
  mongo_data:
